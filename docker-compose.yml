services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    working_dir: /app/backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ebook_analyzer
      REDIS_URL: redis://redis:6379
      EBOOK_STORAGE_PATH: /app/data/ebooks
    volumes:
      - ebook_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: arq workers.worker.WorkerSettings
    working_dir: /app/backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ebook_analyzer
      REDIS_URL: redis://redis:6379
      EBOOK_STORAGE_PATH: /app/data/ebooks
    volumes:
      - ebook_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ebook_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ebook_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  ebook_data:
  postgres_data:
